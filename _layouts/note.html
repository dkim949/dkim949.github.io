---
layout: default
---
<article class="prose">
  <p class="note-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y.%m.%d' }}</time></p>
  {% if page.title != '' %}<h1>{{ page.title | escape }}</h1>{% endif %}
  {{ content }}
  <a class="back-link" href="{{ '/' | relative_url }}">← 작은 기록으로</a>
</article>
