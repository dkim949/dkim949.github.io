{% if page.collection != 'notes' or page.published == true %}<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>{% include head.html %}</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
  <div class="page">
    <header class="site-header">
      <a class="identity" href="{{ '/' | relative_url }}" aria-label="Dongin Kim, 홈으로">
        <pre class="identity-mark" aria-hidden="true">  +++
++   ++
++   ++
  +++</pre>
        <span class="identity-name">DONGIN KIM</span>
      </a>
      <nav class="navigation" aria-label="사이트 메뉴">
        {% for item in site.navigation %}
        <a href="{{ item.url | relative_url }}"{% if page.nav == item.key %} aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </header>
    <div class="header-rule" aria-hidden="true"></div>
    <main id="main-content">{{ content }}</main>
    <footer class="site-footer">
      <span>DONGIN KIM / BERLIN</span>
      <div class="footer-links"><a href="{{ '/feed.xml' | relative_url }}">RSS</a><a href="{{ '/about/' | relative_url }}">조금씩, 오래.</a></div>
    </footer>
  </div>
</body>
</html>
{% endif %}
