name: Site checks

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test explicit note publishing
        run: python3 -B -m unittest discover -s tests
      - name: Build with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          destination: ./_site
      - name: Check routes, assets and publication boundaries
        run: python3 -B scripts/check_site.py _site
