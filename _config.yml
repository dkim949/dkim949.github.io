title: Dongin Kim
author: Dongin Kim
description: "I work on machine learning and delivery time estimation in Berlin, and build small products with AI."
url: "https://dkim949.github.io"
baseurl: ""
lang: en
timezone: Europe/Berlin

navigation:
  - {key: notes, title: Notes, url: /}
  - {key: works, title: Work, url: /works/}
  - {key: blog, title: Writing, url: /blog/}
  - {key: about, title: About, url: /about/}

collections:
  notes:
    output: true
    permalink: /notes/:name/

defaults:
  - scope: {path: "", type: notes}
    values: {layout: note, nav: notes, published: false, title: ""}
  - scope: {path: works}
    values: {nav: works, lang: en}
  - scope: {path: blog}
    values: {nav: blog, lang: en}

plugins:
  - jekyll-seo-tag

sass:
  sass_dir: _sass

exclude:
  - .local
  - .agents
  - .claude
  - vendor
  - node_modules
  - scripts
  - tests
  - docs
  - studio
  - DESIGN.md
  - Gemfile
  - Gemfile.lock
  - plainwhite.gemspec
  - README.md
  - CLAUDE.md
  - AGENTS.md
  - CHANGELOG.md
  - VERSION
  - LICENSE.txt
  - marketing_AB.csv
  - marketing_AB.ipynb
  - assets/images/anomaly_detection2.png
