title: Dongin Kim
author: Dongin Kim
description: "Berlin에서 ML과 배달 시간 예측을 다루고, AI로 작은 제품을 만듭니다."
url: "https://dkim949.github.io"
baseurl: ""
lang: ko
timezone: Europe/Berlin

navigation:
  - {key: notes, title: 기록, url: /}
  - {key: works, title: 만든 것, url: /works/}
  - {key: blog, title: 글, url: /blog/}
  - {key: about, title: 소개, url: /about/}

collections:
  notes:
    output: true
    permalink: /notes/:name/

defaults:
  - scope: {path: "", type: notes}
    values: {layout: note, nav: notes, published: false, title: ""}
  - scope: {path: works}
    values: {nav: works, lang: en}
  - scope: {path: blog}
    values: {nav: blog, lang: en}

plugins:
  - jekyll-seo-tag

sass:
  sass_dir: _sass

exclude:
  - .local
  - vendor
  - node_modules
  - scripts
  - tests
  - docs
  - studio
  - DESIGN.md
  - Gemfile
  - Gemfile.lock
  - plainwhite.gemspec
  - README.md
  - CLAUDE.md
  - AGENTS.md
  - CHANGELOG.md
  - VERSION
  - LICENSE.txt
  - marketing_AB.csv
  - marketing_AB.ipynb
  - assets/images/anomaly_detection2.png
